<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space | PickyCoupon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        
        .dot-grid {
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 30px 30px;
        }
        /* Màu cam thương hiệu Picky */
        .bg-picky-orange { background-color: #eb570c; }
        .text-picky-orange { color: #eb570c; }
    </style>
</head>
<body class="bg-[#fcfcfc] dot-grid min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full text-center">
        <div class="relative mb-12 flex justify-center">
            <div class="animate-float relative z-10">
                <i class="fa-solid fa-rocket text-8xl md:text-9xl text-picky-orange drop-shadow-[0_20px_50px_rgba(235,87,12,0.3)]"></i>
            </div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-orange-100 rounded-full blur-3xl opacity-40 -z-10"></div>
        </div>

        <h1 class="text-7xl md:text-9xl font-black text-gray-900 mb-4 tracking-tighter">404</h1>
        <h2 class="text-xl md:text-2xl font-black text-gray-800 uppercase tracking-widest mb-6">
            Oops, we have a problem!
        </h2>
        <p class="text-gray-500 font-medium mb-10 max-w-md mx-auto leading-relaxed px-4">
            The page you're looking for has drifted into deep space. 
            Don't worry, we can help you find your way back to the best deals.
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 px-6 mb-16">
            <a href="/" class="w-full sm:w-auto px-10 py-4 bg-picky-orange text-white font-black uppercase tracking-widest rounded-2xl shadow-[0_10px_25px_-5px_rgba(235,87,12,0.4)] hover:-translate-y-1 hover:shadow-[0_20px_35px_-5px_rgba(235,87,12,0.5)] transition-all duration-300">
                Back to Home
            </a>
            
            <a href="/deals" class="w-full sm:w-auto px-10 py-4 bg-white text-gray-700 font-black uppercase tracking-widest rounded-2xl border border-gray-100 shadow-sm hover:bg-gray-50 hover:border-gray-200 hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-2">
                <i class="fa-solid fa-fire text-picky-orange text-sm"></i>
                Browse Deals
            </a>
        </div>

        <div class="pt-8 border-t border-gray-100/60 mx-6">
            <p class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-6 italic">Or explore our top categories</p>
            <div class="flex flex-wrap justify-center gap-3">
                <a href="#" class="px-5 py-2.5 bg-white rounded-xl text-[11px] font-black text-gray-500 border border-gray-100 shadow-sm hover:border-picky-orange/30 hover:text-picky-orange hover:shadow-md transition-all uppercase tracking-wider">#Electronics</a>
                <a href="#" class="px-5 py-2.5 bg-white rounded-xl text-[11px] font-black text-gray-500 border border-gray-100 shadow-sm hover:border-picky-orange/30 hover:text-picky-orange hover:shadow-md transition-all uppercase tracking-wider">#Fashion</a>
                <a href="#" class="px-5 py-2.5 bg-white rounded-xl text-[11px] font-black text-gray-500 border border-gray-100 shadow-sm hover:border-picky-orange/30 hover:text-picky-orange hover:shadow-md transition-all uppercase tracking-wider">#Beauty</a>
                <a href="#" class="px-5 py-2.5 bg-white rounded-xl text-[11px] font-black text-gray-500 border border-gray-100 shadow-sm hover:border-picky-orange/30 hover:text-picky-orange hover:shadow-md transition-all uppercase tracking-wider">#Travel</a>
            </div>
        </div>
    </div>

</body>
</html>
